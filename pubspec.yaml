name: grooveforge
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 3.3.0+77
environment:
  sdk: ^3.7.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_midi_command: ^0.5.3
  flutter_midi_pro:
    path: packages/flutter_midi_pro
  dart_vst_host:
    path: packages/flutter_vst3/dart_vst_host
  grooveforge_plugin_api:
    path: packages/grooveforge_plugin_api
  grooveforge_plugin_ui:
    path: packages/grooveforge_plugin_ui
  provider: ^6.1.5+1
  file_picker: ^10.3.10
  # Hands a score to whatever the device already uses for that kind of file.
  # MIT, plain platform channels, no bundled blobs.
  open_filex: ^4.7.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.4
  path: ^1.9.1
  flutter_markdown_plus: ^1.0.7
  yaml: ^3.1.2
  package_info_plus: ^9.0.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  permission_handler: ^12.0.1
  # Sync between band members: HMAC for the handshake, AES-GCM for the channel.
  # Both pure Dart, so nothing new is bundled and F-Droid has nothing to build.
  crypto: ^3.0.6
  cryptography: ^2.7.0
  # QR for pairing. ZXing-C++ over FFI, MIT — no Google ML Kit, which is a
  # proprietary blob F-Droid will not accept.
  flutter_zxing: ^3.0.1
  # QR *rendering* for the host side. Pure Dart, so it works on every platform
  # including the desktop builds, where flutter_zxing's scanner does not.
  qr_flutter: ^4.1.0
  # mDNS/Bonjour, so a band that has met once can find each other again with
  # no code to scan. MIT, and the only option covering Linux as well as the
  # phones — `nsd` has no Linux implementation.
  bonsoir: ^7.1.4
  audio_session: ^0.2.2
  ffi: ^2.2.0

dependency_overrides:
  flutter_midi_command_linux:
    path: packages/flutter_midi_command_linux

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter_launcher_icons:
  image_path: "assets/branding/icon_master.png"
  min_sdk_android: 26

  # Android. Adaptive icons are required from API 26 onwards, which is exactly
  # our minSdk: without them, launchers frame the icon inside a white badge.
  # The inset defaults to 16%, but gen_assets.py already fits the foreground
  # inside the safe zone, hence 0.
  android: "launcher_icon"
  image_path_android: "assets/branding/icon_master.png"
  adaptive_icon_background: "assets/branding/icon_adaptive_back.png"
  adaptive_icon_foreground: "assets/branding/icon_adaptive_fore.png"
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: "assets/branding/icon_monochrome.png"

  # iOS applies its own mask to a full square — hence the full-bleed variant —
  # and it refuses transparency.
  ios: true
  image_path_ios: "assets/branding/icon_full_bleed.png"
  remove_alpha_ios: true
  background_color_ios: "#0a1828"

  macos:
    generate: true
    image_path: "assets/branding/icon_macos.png"

  windows:
    generate: true
    image_path: "assets/branding/icon_master.png"
    icon_size: 256

  web:
    generate: true
    image_path: "assets/branding/icon_master.png"
    background_color: "#0a1828"
    theme_color: "#e2701c"

  # No linux section: flutter_launcher_icons 0.14 does not support one, and
  # silently ignored it. Linux icons are produced by design/gen_assets.py into
  # design/assets/linux/hicolor/, for the packaging to pick up (.desktop,
  # Flatpak, AppImage).

flutter_native_splash:
  color: "#0a1828"
  # The background is a bare gradient, with no lettering: Android stretches it
  # with gravity="fill" to cover the screen, which a gradient takes and text
  # would not. The wordmark and slogan live in the centred layer, which the
  # system never distorts.
  background_image: "assets/branding/splash_bg_portrait.png"
  image: "assets/branding/splash_center.png"
  fullscreen: true

  android: true
  ios: true
  web: false

  # From Android 12 on, the system draws the launch screen itself: an icon
  # centred on a flat colour, with no full-bleed image possible. The icon is
  # 1152 px, of which only the central 768 survive the mask.
  android_12:
    image: "assets/branding/splash_android12.png"
    color: "#0a1828"


# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/soundfonts/
    - assets/plugins/
    - assets/drums/
    - assets/branding/splash_bg_portrait.png
    - assets/branding/splash_center.png
    - CHANGELOG.md
    - CHANGELOG.fr.md
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
