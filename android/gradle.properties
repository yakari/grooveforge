org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# R8 optimized resource shrinking (AGP 8.11+; on by default from AGP 9).
# Play Console flags its absence as "optimized resource shrinking is not enabled".
android.r8.integratedResourceShrinking=true
android.r8.optimizedShrinking=true
